# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# Abandoned Connection Cleanup (HikariCP and MySQL settings)
spring.datasource.hikari.data-source-properties.removeAbandoned=true
spring.datasource.hikari.data-source-properties.removeAbandonedTimeout=60
spring.datasource.hikari.data-source-properties.logAbandoned=true




