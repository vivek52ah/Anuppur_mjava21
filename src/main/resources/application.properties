spring.profiles.active=local
#  spring.profiles.active=test
# spring.profiles.active=prod

# Hibernate 6 - disable JPQL query validation at startup for backward compatibility
spring.jpa.properties.hibernate.query.jpaql_strict_compliance=false

# Central upload limits. Individual documents are additionally validated by extension, MIME and signature.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Secure defaults: profiles must explicitly opt in to operational/documentation endpoints.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=

# Never expose exception, binding, SQL/schema or stack-trace details to a client.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.server-header=

# Honor HTTPS forwarded by trusted Tomcat proxies; keep redirects relative so a proxy
# cannot downgrade the scheme or reflect an untrusted Host in an absolute Location.
server.forward-headers-strategy=native
server.tomcat.use-relative-redirects=true
server.tomcat.redirect-context-root=false
server.tomcat.allow-trace=false
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for




