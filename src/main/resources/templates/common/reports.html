.column-toggle-container {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	margin-bottom: 15px;
	padding: 10px;
	background-color: #f8f9fa;
	border-radius: 8px;
	border: 1px solid #dee2e6;
	max-height: 250px;
	overflow-y: auto;
}

.column-toggle-container label {
	background: #ffffff;
	border: 1px solid #ced4da;
	border-radius: 5px;
	padding: 5px 10px;
	font-size: 14px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 6px;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.column-toggle-container input[type="checkbox"] {
	cursor: pointer;
}

#toggleAllColumns {
	padding: 8px 16px;
	font-size: 14px;
	background-color: #007bff; /* Bootstrap blue */
	color: white;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
	transition: background-color 0.3s ease, transform 0.2s ease;
}

#toggleAllColumns:hover {
	background-color: #0056b3;
	transform: translateY(-1px);
}

#toggleAllColumns:active {
	transform: scale(0.98);
}
</style>

<body>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span> Works Reports </span>
							<!-- 	<li  class="breadcrumb-item"><a href="#dashboard"><span
				             th:text="${roleName}"></span></a></li> -->
						</div>
						<div class="card-body">


							<div class="pr">
								<form name="searchForm" novalidate="novalidate" id="searchForm">
									<fieldset class="legend-border">
										<legend class="legend-border">Filters</legend>
											<div class="row">
							
											<!-- Work Name -->
											<div class="form-group col-sm-4" style="position:relative;">
												
												<input type="text" class="form-control" placeholder="--Work Unique ID--" id="searchBoxVal" name="searchBoxVal" ng-model="workNo"
													ng-change="loadWorkNoSuggestions(workNo)" />
											
												<ul class="list-group" ng-show="suggestedWorkNos.length > 0">
													<li class="list-group-item" ng-repeat="no in suggestedWorkNos" ng-click="selectWorkNo(no)">
														{{no}}
													</li>
												</ul>
											</div>
							
											<!-- Financial Year -->
										<div id="fyId" class="form-group col-sm-4" data-ng-init="loadFinancialYears();">
												
												<select multiple="multiple" class="form-control " id="financialYear1" data-ng-model="workData.financialYear"
													 name="financialYear" data-live-search="true">
													<option value="" disabled="disabled">--Select
														Financial Year--</option>
													<option data-ng-repeat="financialYearName in financialYears "
														value="{{financialYearName.financialYearId}}"
														data-ng-class="{'selected-option': isSelected(financialYearName.financialYearId)}">
														{{financialYearName.financialYearName}}</option>
												</select>
											</div>
							
											<!-- Department -->
							
							
											<!--  	<option
																					data-ng-repeat="divisionName in divisions | orderBy : 'divisionName'"
																					value="{{divisionName.divisionId}}">{{divisionName.divisionName}}</option> -->
							
							
											<div class="form-group col-sm-4">
												
												<select class="form-control" id="divisionId" data-ng-model="workData.divisionId"
													data-ng-init="loadDivisionsWork();" name="divisionId" disabled="disabled">
													<option value="" disabled="disabled">--Select
														Division--</option>
													<option value="3">Shahdol</option>
												</select>
											</div>
							
											<!--  			<option
																					data-ng-repeat="districtName in districts | orderBy : 'districtName'"
																					value="{{districtName.districtId}}">{{districtName.districtName}}</option> -->
							
							
							
											<div class="form-group col-sm-4">
											
												<select class="form-control" id="districtId" data-ng-model="workData.districtId"
													data-ng-init="loadDistrictsWork();" disabled="disabled"
													data-ng-change="reloadJqueryDatatable();" name="districtId">
													<option value="" disabled="disabled">--Select
														District--</option>
													<option value="49">Anuppur</option>
												</select>
											</div>
											<div id="wtId" class="form-group col-sm-4">
												
												<select multiple="multiple" class="form-control" id="workType1" data-ng-model="workData.workType"
													data-ng-init="loadWorkTypes();" data-ng-change="" name="workType" data-live-search="true">
													<option value="" disabled="disabled">--Select Work
														Type--</option>
													<option data-ng-repeat="workType in workTypes | filter:workType"
														value="{{workType.workTypeId}}" data-ng-class="{'selected-option': isSelected(workType.workTypeId)}">{{workType.workTypeNameE}}
													</option>
												</select>
							
											</div>
							
							
											<!-- Work Status -->
											<div id="wsId" class="form-group col-sm-4">
												
												<select multiple="multiple" class="form-control" id="workStatusId" data-ng-model="workData.workStatusId"
													data-ng-init="loadWorkStatus1();" name="workStatusId" data-live-search="true">
													<option value="" disabled="disabled">--Select Work
														Status--</option>
													<option data-ng-repeat="worksStatusName in worksStatus | filter:worksStatu"
														value="{{worksStatusName.workStatusId}}"  data-ng-class="{'selected-option': isSelected(worksStatusName.workStatusId)}">
														{{worksStatusName.workStatusNameE}}</option>
												</select>
											</div>
							
											<!-- Implementation Agency -->
											<div id="iaId" class="form-group col-sm-4" data-ng-init="loadAgencies()">
												
												<select multiple="multiple" class="form-control" data-ng-model="workData.implementationAgency"
													name="implementationAgency" id="implementationAgency" data-live-search="true">
													<option value="" disabled="disabled">--Select
														Agency--</option>
													<option data-ng-repeat="agency in agencies | filter:implAgency"
														value="{{agency.implementationAgencyId}}" data-ng-class="{'selected-option': isSelected(agency.implementationAgencyId)}">
														{{agency.implementationAgencyNameE}}</option>
												</select>
											</div>
							
							
											<div id="drId" class="form-group col-sm-4" data-ng-init="loadDepartmentMasters(); ">
												
												<select multiple="multiple" class="form-control" id="departmentRemark" data-ng-model="workData.departmentRemark"
													name="departmentRemark" data-live-search="true">
													<option value="" disabled="disabled">--Select DM Remarks--
													</option>
													<option data-ng-repeat="dept in departmentMasters | filter:departmentText" value="{{dept.id}}"
													data-ng-class="{'selected-option': isSelected(dept.id)}">
														{{dept.name}}</option>
												</select>
											</div>
							
							
											<div id="fyhId" class="form-group col-sm-4" data-ng-init="loadFinancialHead();">
												
												<select  multiple="multiple" class="form-control" data-ng-model="workData.financialHeadId" name="financialHeadId"
													id="financialHeadId1" required="required" data-live-search="true">
													<option value="" disabled="disabled">--Select Financial Head--
													</option>
													<option data-ng-repeat="financialHead in financialHeads | filter:financialHeadText"
														value="{{financialHead.id}}" data-ng-class="{'selected-option': isSelected(financialHead.id)}">{{financialHead.financialHeadName}}
													</option>
												</select>
											</div>
							
							
											<div id="vsId" class="form-group col-sm-4" data-ng-init="loadVidhanSabha();">
												
												<select multiple="multiple" class="form-control" data-ng-model="workData.vidhanSabhaId" name="vidhanSabhaId"
													id="vidhanSabhaId1" required="required" data-live-search="true">
													<option value="" disabled="disabled">--Select Vidhan Sabha--</option>
													<option data-ng-repeat="vidhanSabha in vidhanSabhas | filter:vidhanSabhaText"
														value="{{vidhanSabha.id}}" data-ng-class="{'selected-option': isSelected(vidhanSabha.id)}">{{vidhanSabha.vidhanSabhaName}}
													</option>
												</select>
											</div>
							
										<!-- Work Name Filter -->
										<div class="form-group col-sm-4" style="position: relative;">
											<input type="text" class="form-control"
												placeholder="--Search Work Name--" id="workNameFilter"
												name="workNameFilter" ng-model="workNameSearch"
												data-ng-change="loadWorkNameSuggestions(workNameSearch)" />

											<ul class="list-group" ng-show="suggestedWorkNames.length > 0"
												style="position: absolute; z-index: 1000; width: 100%; max-height: 200px; overflow-y: auto;">
												<li class="list-group-item"
													ng-repeat="name in suggestedWorkNames"
													ng-click="selectWorkName(name)">{{name}}</li>
											</ul>
										</div>

										<!-- Block Filter -->
										<div id="blId" class="form-group col-sm-4" data-ng-init="loadBlocksByDistrict();">
											<select multiple="multiple" class="form-control selectpicker" id="blockId" data-ng-model="workData.blockId"
											name="blockId" data-live-search="true">
											<option value="" disabled="disabled">--Select Block--</option>
											<option data-ng-repeat="block in blocks | orderBy : 'blockName'"
												value="{{block.blockId}}"
												data-ng-class="{'selected-option': isSelected(block.blockId)}">
												{{block.blockName}}</option>
										</select>
										</div>
										
										</div>
									</fieldset>
								</form>
							</div>

							<div class="form-group col-sm-12 text-right mt-2">
								<button type="button" class="btn btn-primary"
									onclick="window.reloadJqueryDatatables();">Search</button>
								<button type="button" class="btn btn-secondary"
									onclick="resetFilters();">Reset</button>
							</div>


							<div class="checkbox-container">
								<div
									style="background-color: #f1f1f1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 5px;">
									<label class="m-0"><strong>Filter Parameters</strong></label>
								</div>
							</div>

							<button id="toggleAllColumns">Select All</button>

							<br /> <br />
							<div class="checkbox-container column-toggle-container neat-grid">

      <label><input type="checkbox" class="col-toggle" data-column="0" checked="checked" /> S.No.</label>
   	 <label><input type="checkbox" class="col-toggle" data-column="1" checked="checked" /> Division</label>
	 <label><input type="checkbox" class="col-toggle" data-column="2" checked="checked" /> District</label>
	 <label><input type="checkbox" class="col-toggle" data-column="3" checked="checked" /> Work Unique ID</label>
	 <label><input type="checkbox" class="col-toggle" data-column="4" checked="checked" /> Work Name</label>
     <label><input type="checkbox" class="col-toggle" data-column="5" checked="checked" /> Work Type</label>
	 <label><input type="checkbox" class="col-toggle" data-column="6" checked="checked" /> FY of Sanction</label>
	 <label><input type="checkbox" class="col-toggle" data-column="7" checked="checked" /> Executive Agency</label>
	 <label><input type="checkbox" class="col-toggle" data-column="8" checked="checked" /> Financing Agency</label>
	 <label><input type="checkbox" class="col-toggle" data-column="9" checked="checked" /> Total Administrative Sanction Amount </label>
	 <label><input type="checkbox" class="col-toggle" data-column="10" checked="checked" /> Year of Administrative Sanction</label>
    <label><input type="checkbox" class="col-toggle" data-column="11" checked="checked" /> Administrative Sanction Date. </label>
    <label><input type="checkbox" class="col-toggle" data-column="12" checked="checked" /> Agreement Date </label>
     <label><input type="checkbox" class="col-toggle" data-column="13" checked="checked" /> Agreement No </label>

$(document).ready(function () {

	const defaultSelect = [0, 3, 4, 7, 9, 10, 11, 12, 14, 16, 17, 18, 24];
    const $checkboxes = $(".col-toggle");
    const $dropdown = $("#add-column-list");
    const $toggleBtn = $("#toggleAllColumns");

    // -----------------------------
    // Load saved state
    // -----------------------------
    let savedCols = sessionStorage.getItem("selectedColumns");
    savedCols = savedCols ? JSON.parse(savedCols).map(x => parseInt(x)) : null;

    $checkboxes.each(function () {
        const idx = parseInt($(this).data("column"));

        if (savedCols) {
            $(this).prop("checked", savedCols.includes(idx));
        } else {
            $(this).prop("checked", defaultSelect.includes(idx));
        }
    });

    // -----------------------------
    // MASTER REFRESH FUNCTION
    // -----------------------------
    function refreshAll() {

        // 1) Checkbox → Column show/hide
        $checkboxes.each(function () {
            const idx = parseInt($(this).data("column"));
            const isChecked = $(this).is(":checked");

            table.column(idx).visible(isChecked);
            // SHOW/HIDE checkbox div
            $(this).parent().toggle(isChecked);
        });

        table.columns.adjust().draw();

        // 2) Update dropdown → only unchecked columns
        $dropdown.empty().append(`<option value="">-- Select Column to Add --</option>`);

        $checkboxes.each(function () {
            if (!$(this).is(":checked")) {
                let idx = $(this).data("column");
                let name = $(this).parent().text().trim();
                $dropdown.append(`<option value="${idx}">${name}</option>`);
            }
        });

        // 3) Update Select All button text
        const allChecked = $checkboxes.length === $checkboxes.filter(':checked').length;
        $toggleBtn.text(allChecked ? "Deselect All" : "Select All");

        // 4) Save state
        saveState();
    }

    // -----------------------------
    // Save selected columns
    // -----------------------------
    function saveState() {
        let arr = [];
        $checkboxes.each(function () {
            if ($(this).is(':checked')) arr.push($(this).data("column"));
        });
        sessionStorage.setItem("selectedColumns", JSON.stringify(arr));
    }

    // INITIAL RUN
    refreshAll();

    // -----------------------------
    // Checkbox toggle
    // -----------------------------
    $checkboxes.change(function () {
        refreshAll();
    });

    // -----------------------------
    // Dropdown Add Column
    // -----------------------------
    $dropdown.change(function () {
        let selected = $(this).val();
        if (!selected) return;

        selected.forEach(function (colIdx) {
            $checkboxes.filter(`[data-column="${colIdx}"]`).prop("checked", true);
        });

        $(this).val([]);  // reset
        refreshAll();
    });

    // -----------------------------
    // Select All / Deselect All
    // -----------------------------
    $toggleBtn.click(function () {
        let doSelect = $(this).text() === "Select All";
        $checkboxes.prop("checked", doSelect);
        refreshAll();
    });

    // -----------------------------
    // Dropdown Animation
    // -----------------------------
    $("#dropdownBtn").click(function (e) {
        e.stopPropagation();
        $("#dropdownContainer").slideToggle(150);
    });

    $(document).click(function () {
        $("#dropdownContainer").slideUp(150);
    });

    $("#dropdownContainer").click(function (e) {
        e.stopPropagation();
    });

});

</script>

            scope.date = doc.createdDate; // yaha set hoga har image ke hisab se
        });

        // Optional: show counter (like 2/10)
	       document.getElementById('imageCounter').innerText =
     	       (index + 1) + '/' + window.currentImageList.length;
        
        
    }
};

window.showNextImage = function () {
    if (window.currentImageIndex < window.currentImageList.length - 1) {
        window.currentImageIndex++;
        window.showImageAt(window.currentImageIndex);
    }
};

window.showPrevImage = function () {
    if (window.currentImageIndex > 0) {
        window.currentImageIndex--;
        window.showImageAt(window.currentImageIndex);
    }
};
    /*]]>*/
</script>

<!-- Zoom Overlay with Prev/Next -->
<div id="zoomOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:99999;align-items:center;justify-content:center;">
    <button onclick="closeZoomOverlay()" style="position:absolute;top:15px;right:20px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;">&times;</button>
    <button onclick="zoomPrev()" style="position:absolute;left:20px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:40px;padding:10px 18px;border-radius:50%;cursor:pointer;">&#8249;</button>
    <img id="zoomImage" src="" style="max-width:90%;max-height:90vh;border-radius:6px;box-shadow:0 0 30px rgba(0,0,0,0.5);" />
    <button onclick="zoomNext()" style="position:absolute;right:20px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:40px;padding:10px 18px;border-radius:50%;cursor:pointer;">&#8250;</button>
    <div style="position:absolute;bottom:20px;color:#fff;font-size:14px;" id="zoomCounter"></div>
</div>

<script>
/*<![CDATA[*/
function openZoomOverlay() {
    var src = document.getElementById('modalImage').src;
    document.getElementById('zoomImage').src = src;
    var total = window.currentImageList ? window.currentImageList.length : 1;
    var idx = window.currentImageIndex !== undefined ? window.currentImageIndex : 0;
    document.getElementById('zoomCounter').innerText = (idx + 1) + ' / ' + total;
    document.getElementById('zoomOverlay').style.display = 'flex';
}
function closeZoomOverlay() {
    document.getElementById('zoomOverlay').style.display = 'none';
}
function zoomNext() {
    if (window.currentImageList && window.currentImageIndex < window.currentImageList.length - 1) {
        window.currentImageIndex++;
        window.showImageAt(window.currentImageIndex);
        document.getElementById('zoomImage').src = document.getElementById('modalImage').src;
        document.getElementById('zoomCounter').innerText = (window.currentImageIndex + 1) + ' / ' + window.currentImageList.length;
    }
}
function zoomPrev() {
    if (window.currentImageList && window.currentImageIndex > 0) {
        window.currentImageIndex--;
        window.showImageAt(window.currentImageIndex);
        document.getElementById('zoomImage').src = document.getElementById('modalImage').src;
        document.getElementById('zoomCounter').innerText = (window.currentImageIndex + 1) + ' / ' + window.currentImageList.length;
    }
}
document.addEventListener('keydown', function(e) {
    var overlay = document.getElementById('zoomOverlay');
    if (!overlay || overlay.style.display === 'none') return;
    if (e.key === 'ArrowRight') zoomNext();
    else if (e.key === 'ArrowLeft') zoomPrev();
    else if (e.key === 'Escape') closeZoomOverlay();
});
/*]]>*/
</script>

</body>
</html>
