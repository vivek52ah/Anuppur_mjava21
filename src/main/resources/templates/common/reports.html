.column-toggle-container {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	margin-bottom: 15px;
	padding: 10px;

	border-radius: 8px;

}

	background: #ffffff;
	border: 1px solid #ced4da;
	border-radius: 5px;
	padding: 5px 10px;
	font-size: 14px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 6px;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.column-toggle-container input[type="checkbox"] {
	cursor: pointer;
}

#toggleAllColumns {
	padding: 8px 16px;
	font-size: 14px;
	background-color: #007bff; /* Bootstrap blue */
	color: white;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
	transition: background-color 0.3s ease, transform 0.2s ease;
}

	background-color: #0056b3;

<body>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadWorkForReport();">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span> Works Reports </span>
							<!-- 	<li  class="breadcrumb-item"><a href="#dashboard"><span
				             th:text="${roleName}"></span></a></li> -->
						</div>
						<div class="card-body">


							<div class="pr">
								<form name="searchForm" novalidate="novalidate" id="searchForm">
									<fieldset class="legend-border">
										<legend class="legend-border">Filters</legend>
										<div class="row">

											<!-- Work Name -->
										<div class="form-group col-sm-4" style="position:relative;">
													<div class="form-group col-sm-4">
								
											</div>
												<input type="text" class="form-control" placeholder="--Type Work Name--" id="searchBoxVal" name="searchBoxVal" ng-model="workName"
													ng-change="loadWorkNameSuggestions(workName)" />
											
												<ul class="list-group" ng-show="suggestedWorkNames.length > 0">
													<li class="list-group-item" ng-repeat="name in suggestedWorkNames" ng-click="selectWorkName(name)">
														{{name}}
													</li>
												</ul>
											</div>

											<!-- Financial Year -->
										<div class="form-group col-sm-4">
												<input type="text" class="form-control search-input" ng-model="financialYear"
													placeholder="Search..." ng-change="updateFilter()" />
												<select class="form-control" id="financialYear" data-ng-model="workData.financialYear"
													data-ng-init="loadFinancialYears();" name="financialYear">
													<option value="" disabled="disabled">--Select
														Financial Year--</option>
													<option data-ng-repeat="financialYearName in financialYears | filter:financialYear"
														value="{{financialYearName.financialYearId}}">
														{{financialYearName.financialYearName}}</option>
												</select>
											</div>




											<!-- Work Status -->
											<div class="form-group col-sm-4">
												<input type="text" class="form-control search-input" ng-model="worksStatu" placeholder="Search..."
													ng-change="updateFilter()" />
												<select class="form-control" id="workStatusId" data-ng-model="workData.workStatusId"
													data-ng-init="loadWorkStatus1();" name="workStatusId">
													<option value="" disabled="disabled">--Select Work
														Status--</option>
													<option data-ng-repeat="worksStatusName in worksStatus | filter:worksStatus"
														value="{{worksStatusName.workStatusId}}">
														{{worksStatusName.workStatusNameE}}</option>
												</select>
											</div>

											<!-- Implementation Agency -->
											<div class="form-group col-sm-4" data-ng-init="loadAgencies()">
												<input type="text" class="form-control search-input" ng-model="implAgency" placeholder="Search..."
													ng-change="updateFilter()" />
												<select class="form-control" data-ng-model="workData.implementationAgency"
													name="implementationAgency" id="implementationAgency">
													<option value="" disabled="disabled">--Select
														Agency--</option>
													<option data-ng-repeat="agency in agencies | filter:implAgency"
														value="{{agency.implementationAgencyId}}">
														{{agency.implementationAgencyNameE}}</option>
												</select>
											</div>

										<div class="form-group col-sm-4" data-ng-init="loadWorkPriority(); ">
												<input type="text" class="form-control search-input" ng-model="priorityText" placeholder="Search..."
													ng-change="updateFilter()" />
												<select class="form-control" id="workPriorityId" data-ng-model="workData.workPriorityId"
													name="workPriorityId">
													<option value="" disabled="disabled">--Select Work Priority--
													</option>
													<option data-ng-repeat="priority in priorityies | filter:priorityText" value="{{priority.id}}">
														{{priority.workPriorityName}}</option>
												</select>
											</div>

										<div class="form-group col-sm-4" data-ng-init="loadFinancialHead();">
												<input type="text" class="form-control search-input" ng-model="financialHeadText"
													placeholder="Search..." ng-change="updateFilter()" />
												<select class="form-control" data-ng-model="workData.financialHeadId" name="financialHeadId"
													id="financialHeadId" required="required">
													<option value="" disabled="disabled">--Select Financial Head--
													</option>
													<option data-ng-repeat="financialHead in financialHeads | filter:financialHeadText"
														value="{{financialHead.id}}">{{financialHead.financialHeadName}}
													</option>
												</select>
											</div>


											<div class="form-group col-sm-4" data-ng-init="loadVidhanSabha();">
												<input type="text" class="form-control search-input" ng-model="vidhanSabhaText"
													placeholder="Search..." ng-change="updateFilter()" />
												<select class="form-control" data-ng-model="workData.vidhanSabhaId" name="vidhanSabhaId"
													id="vidhanSabhaId" required="required">
													<option value="" disabled="disabled">--Select Vidhan Sabha--</option>
													<option data-ng-repeat="vidhanSabha in vidhanSabhas | filter:vidhanSabhaText"
														value="{{vidhanSabha.id}}">{{vidhanSabha.vidhanSabhaName}}
													</option>
												</select>
											</div>

										</div>
									</fieldset>
								</form>
							</div>

							<div class="form-group col-sm-12 text-right mt-2">
								<button type="button" class="btn btn-primary"
									onclick="window.reloadJqueryDatatables();">Search</button>
								<button type="button" class="btn btn-secondary"
									onclick="resetFilters();">Reset</button>
							</div>


							<div class="checkbox-container">
								<div
									style="background-color: #f1f1f1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 5px;">
									<label class="m-0"><strong>Filter Parameters</strong></label>
								</div>
							</div>

							<button id="toggleAllColumns">Select All</button>

							<br /> <br />
							<div class="checkbox-container column-toggle-container neat-grid">

    <label><input type="checkbox" class="col-toggle" data-column="0" checked="checked" /> S.No.</label>
    <label><input type="checkbox" class="col-toggle" data-column="1" checked="checked" /> Work Unique ID</label>
    <label><input type="checkbox" class="col-toggle" data-column="2" checked="checked" /> Work Name</label>
    <label><input type="checkbox" class="col-toggle" data-column="3" checked="checked" /> Work Type</label>

    <label><input type="checkbox" class="col-toggle" data-column="4" checked="checked" /> FY of Sanction</label>
    <label><input type="checkbox" class="col-toggle" data-column="5" checked="checked" /> District</label>
    <label><input type="checkbox" class="col-toggle" data-column="6" checked="checked" /> Executive Agency</label>
    <label><input type="checkbox" class="col-toggle" data-column="7" checked="checked" /> Division Name</label>

    <label><input type="checkbox" class="col-toggle" data-column="8" checked="checked" /> Year of Sanction</label>
    <label><input type="checkbox" class="col-toggle" data-column="9" checked="checked" /> Date Of Sanction</label>
    <label><input type="checkbox" class="col-toggle" data-column="10" checked="checked" /> Sanction Amount</label>
    <label><input type="checkbox" class="col-toggle" data-column="11" checked="checked" /> Work Order</label>

    <label><input type="checkbox" class="col-toggle" data-column="12" checked="checked" /> Timeline (Months)</label>
    <label><input type="checkbox" class="col-toggle" data-column="13" checked="checked" /> Total Expenditure</label>
    <label><input type="checkbox" class="col-toggle" data-column="14" checked="checked" /> Completion Level</label>
    <label><input type="checkbox" class="col-toggle" data-column="15" checked="checked" /> Contractor Name</label>

    <label><input type="checkbox" class="col-toggle" data-column="16" checked="checked" /> SOR Year</label>
    <label><input type="checkbox" class="col-toggle" data-column="17" checked="checked" /> Tender %</label>
    <label><input type="checkbox" class="col-toggle" data-column="18" checked="checked" /> Current Status</label>
    <label><input type="checkbox" class="col-toggle" data-column="19" checked="checked" /> Work Priority</label>

    <label><input type="checkbox" class="col-toggle" data-column="20" checked="checked" /> Financing Agency</label>
    <label><input type="checkbox" class="col-toggle" data-column="21" checked="checked" /> Vidhan Sabha</label>
    <label><input type="checkbox" class="col-toggle" data-column="22" checked="checked" /> DM Remarks</label>
    <label><input type="checkbox" class="col-toggle" data-column="23" checked="checked" /> Action</label>

</div>

<div class="slide-dropdown-wrapper" style="position: relative; width: 260px; float:right;">

    <button id="dropdownBtn" style="
        width: 100%;
        padding: 7px;
        border: 1px solid #888;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        text-align: left;">
        Add Column ▼
    </button>

    <div id="dropdownContainer" style="display:none; position:absolute; width:100%; z-index:999;">
        <select id="add-column-list" multiple="multiple" size="7" style="
            width:100%;
            padding:6px;
            border:1px solid #aaa;
            border-radius:4px;
            background:white;">
            <option value="">-- Select Column to Add --</option>
        </select>
    </div>

</div>


							<table id="dynamic-w-table" style="width: 100%">
								<thead>
									<!-- <tr>
                <th>S.No</th>
                <th>Work ID</th>
                <th>Work Name</th>
                <th>Work Type</th>
                <th>Financial Year</th>
                More headers as per above
            </tr> -->
								</thead>
								<tbody>
									<!-- Data will be filled by Ajax -->
								</tbody>
							</table>





							<script>
   /*<![CDATA[*/
	   
	  function getBaseUrl() {
    var path = window.location.pathname;
    var firstPart = path.split('/')[1];

    // If context path is 'anuppur', return it with slash
    if (firstPart === 'anuppur') {
        return '/' + firstPart;
    }

    // Else no context path (like in LIVE), return empty
    return '';
} 
	   
    var table;

    $(document).ready(function () {
        table = $('#dynamic-w-table').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
            	url: getBaseUrl() + '/systemAdmin/fetchWorkForReport',
                type: 'GET',
                data: function (d) {
                	
                	
                	d.searchBoxVal = $('#searchBoxVal').val().trim();
                    d.workType = $('#workType').val();
                    d.financialYear = $('#financialYear').val();
                    d.divisionId = $('#divisionId').val();
                    d.districtId = $('#districtId').val();
                    d.workStatusId = $('#workStatusId').val();
                    d.workSubTypeId = $('#workSubTypeId').val();
                    d.department = $('#department').val();
                    d.implementationAgency = $('#implementationAgency').val();
                    d.workPriorityId = $('#workPriorityId').val();
                    d.financialHeadId = $('#financialHeadId').val();
                    d.vidhanSabhaId = $('#vidhanSabhaId').val();
                    
                	    
                	    
                	    
                	    console.log("Sending filters to backend: ", {
                	        searchBoxVal: d.searchBoxVal,
                	        financialYear: d.financialYear,
                	        department: d.department,
                	        workStatusId: d.workStatusId,
                	        implementationAgency: d.implementationAgency,
                	        workPriorityId: d.workPriorityId,
                	        financialHeadId: d.financialHeadId,
                	        vidhanSabhaId: d.vidhanSabhaId
                	    });
                	    
                    d.iDisplayLength = d.length; // ✅ Already sent by DataTables
                    d.iDisplayStart = d.start;   // ✅ Already sent
                    d.sort = 'id';         // ✅ Your custom key if needed
                }

            },
            scrollX: true,
            autoWidth: false,
            destroy: true,
            fixedHeader: true,
            responsive: true,
            dom: 'Blfrtip',
            pagingType: 'full_numbers',
            bStateSave: false,
            iDisplayLength: 10,
            iDisplayStart: 0,
            paging: true,
            aaSorting: [],
            
            lengthMenu: [[10, 25, 50, 100000], [10, 25, 50, "All"]],
            

            columns: [ 
                {
                    data: null,
                    title: "S.No.",
                    orderable: false,
                    render: function (data, type, row, meta) {
                        return meta.row + meta.settings._iDisplayStart + 1;
                    }
                },
                { data: "workNo", title: "Work No", defaultContent: "-" },
                { data: "workName", title: "Work Name", defaultContent: "-" },
                { data: "workType", title: "Work Type", defaultContent: "-" },
                { data: "financialYearName", title: "Financial Year", defaultContent: "-" },
                { data: "districtName", title: "District", defaultContent: "-" },
                { data: "implementationAgencyName", title: "Construction Agency", defaultContent: "-" },
                { data: "divisionName", title: "Division Name", defaultContent: "-" },
                { data: "yearOfAdministrativeApproval", title: "Year of Administrative Sanction", defaultContent: "-" },
                { data: "dateOfAdministrativeApproval", title: "Date of Administrative Sanction", defaultContent: "-" },
                { data: "amountOfAdministrativeApproval", title: "Amount of Administrative Sanction (Rs. in Lakh)", defaultContent: "-" },
                { data: "workOrderDate", title: "Work Order", defaultContent: "-" },
                { data: "timeLineInMonths", title: "Time Line in Months", defaultContent: "-" },
                { data: "totalExpeditureTillDate", title: "Total Expenditure Till Date", defaultContent: "-" },
                { data: "levelOfCompletion", title: "Level of Completion", defaultContent: "-" },
                { data: "contractorName", title: "Contractor Name", defaultContent: "-" },
                { data: "sor", title: "SOR Year", defaultContent: "-" },
                { data: "tenderParcentage", title: "Tender Percentage", defaultContent: "-" },
                { data: "workStatusName", title: "Current Physical Status", defaultContent: "-" },
                { data: "workPriority", title: "Work Priority", defaultContent: "-" },
                {data: "financialHeadName", title: "Financial Head", defaultContent: "-"},
				{data: "vidhanSabhaName", title: "Vidhan Sabha", defaultContent: "-"},
				{
								    data: null,               // tell DataTables we will build the value ourselves
								    title: 'DM  Remarks',
								    defaultContent: '-',
								    render: function (data, type, row) {
								      // get the three pieces (use empty string if any is missing)
								      const dmRemark  = row.DmRemakrs            || '';
								      const dmDate    = row.dmAproveRejectDate   || '';
								      return `
								        ${dmRemark || '-'}
								        <br><small><b>DM&nbsp;Date:</b> ${dmDate || '-'}</small>
								      
								      `;
								    }
								  },
								  {
										data: null,
										title: "Action",
										defaultContent: "-",
										className: "action-col"
									}
               
            ],
            
     //       createdRow: function (nRow, aData, iDataIndex) {

$(document).ready(function () {

    const defaultSelect = [0, 1, 2, 6, 13, 14, 18, 22];

    // -------------------------
    // 1. Load saved columns from sessionStorage
    // -------------------------
    let savedCols = sessionStorage.getItem("selectedColumns");
    savedCols = savedCols ? JSON.parse(savedCols) : null;

    $('.col-toggle').each(function () {
        const colIdx = $(this).data('column');

        // If session has saved state → apply it
        if (savedCols) {
            const isVisible = savedCols.includes(colIdx);
            $(this).prop('checked', isVisible);
            table.column(colIdx).visible(isVisible);
        }
        // Else first time → apply default selections
        else {
            if (defaultSelect.includes(colIdx)) {
                $(this).prop('checked', true);
                table.column(colIdx).visible(true);
            } else {
                $(this).prop('checked', false);
                table.column(colIdx).visible(false);
            }
        }
    });

    table.columns.adjust().draw();


    // -------------------------
    // 2. User manual toggle
    // -------------------------
    $('.col-toggle').on('change', function () {
        const colIdx = $(this).data('column');
        const isVisible = $(this).is(':checked');

        table.column(colIdx).visible(isVisible);
        table.columns.adjust().draw();

        saveStateToSession();
    });


    // -------------------------
    // 3. Toggle All Button
    // -------------------------
    $('#toggleAllColumns').on('click', function () {
        let allOn = $(this).text() === "Select All";

        $('.col-toggle').each(function () {
            const colIdx = $(this).data('column');
            $(this).prop('checked', allOn);
            table.column(colIdx).visible(allOn);
        });

        $(this).text(allOn ? "Deselect All" : "Select All");
        table.columns.adjust().draw();

        saveStateToSession();
    });


    // -------------------------
    // 4. Save current state to sessionStorage
    // -------------------------
    function saveStateToSession() {
        let selectedArr = [];

        $('.col-toggle').each(function () {
            const colIdx = $(this).data('column');
            if ($(this).is(':checked')) {
                selectedArr.push(colIdx);
            }
        });

        sessionStorage.setItem("selectedColumns", JSON.stringify(selectedArr));
    }

});

$('#add-column-list').change(function(){

    let selectedValues = $(this).val();  // array milegi

    if(!selectedValues || selectedValues.length === 0) return;

    selectedValues.forEach(function(colIndex){
        if(colIndex !== ""){
            $('.col-toggle[data-column="'+colIndex+'"]').parent().show();
        }
    });

    // Refresh dropdown list again so added ones disappear
    refreshAddColumnList();

    // Reset dropdown selection
    $(this).val([]);
});


    // Optional: If you want checkboxes to still toggle div manually
    $('.col-toggle').change(function(){
        let colIndex = $(this).data('column');
        if($(this).is(':checked')){
            $('.col-toggle[data-column="'+colIndex+'"]').parent().show();
        } else {
            $('.col-toggle[data-column="'+colIndex+'"]').parent().hide();
        }
        refreshAddColumnList();
    });

});

	<script>
/*<![CDATA[*/

window.currentImageIndex = 0;
window.currentImageList = [];

window.openProgressImages = function (rowIndex) {
    const data = window.progressDocsStore[rowIndex]; // <-- Yeh line important hai

    if (!data || !data.docs) {
        alert("No document data found.");
        return;
    }

    window.currentImageList = data.docs.filter(doc => doc.workStatusId === 10);
    window.currentImageIndex = 0;

    // AngularJS scope update
    const scope = angular.element(document.getElementById('imageModal')).scope();
    scope.$apply(function () {
        scope.workNo = data.workNo;
        scope.workSubTypeName = data.workSubTypeName;
        
	    if (data && data.docs) {
	        angular.forEach(data.docs, function(doc, idx) {
	            scope.date = doc.createdDate; // agar createdDate hai
	        });
	    }
    });

    if (window.currentImageList.length > 0) {
        window.currentImageIndex = 0;
        window.showImageAt(window.currentImageIndex);
        $('#imageModal').modal('show');
    } else {
        alert("No image found.");
    }
};


window.showImageAt = function (index) {
    if (index >= 0 && index < window.currentImageList.length) {
        const doc = window.currentImageList[index];
        const url = getBaseUrl() + '/downloadDocumentWSPro/' + doc.documentId;
        document.getElementById('modalImage').src = url;
        
        
        // AngularJS scope update for createdDate
        const scope = angular.element(document.getElementById('imageModal')).scope();
        scope.$apply(function () {
            scope.date = doc.createdDate; // yaha set hoga har image ke hisab se
        });

        // Optional: show counter (like 2/10)
	       document.getElementById('imageCounter').innerText =
     	       (index + 1) + '/' + window.currentImageList.length;
        
        
    }
};

window.showNextImage = function () {
    if (window.currentImageIndex < window.currentImageList.length - 1) {
        window.currentImageIndex++;
        window.showImageAt(window.currentImageIndex);
    }
};

window.showPrevImage = function () {
    if (window.currentImageIndex > 0) {
        window.currentImageIndex--;
        window.showImageAt(window.currentImageIndex);
    }
};
