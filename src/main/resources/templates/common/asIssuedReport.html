<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
<style>
#dynamic-table tr td:first-child {
	white-space: nowrap;
}

#dynamic-table tr td:nth-child(4) {
	min-width: 200px;
}

.card {
	margin-bottom: 1.5rem;
	box-shadow: 0 0 7px rgb(0 0 0/ 70%);
	border-radius: 7px
}

.btn.btn-secondary {
	box-shadow: 0px 0px 7px rgb(0 0 0/ 10%);
}

btn-xs.btn-primary {
	box-shadow: 0px 0px 20px rgb(0 0 0/ 30%);
}
input#searchBox {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
li#dynamic-table_first {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
li#dynamic-table_previous {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
a.page-link {
 box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}

select#workType {
 box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}

select#financialYear {
 box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}

.tbl-vm tr td > input[type="text"] {
    width: auto;
}
</style>
</head>


<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<!-- <li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li> -->
				
				<li class="breadcrumb-item"><a ><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item active"><span>AS Approval Report</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12" data-ng-init="loadDrawingDataList('2');" >
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span>AS Approval Report</span>
							
						</div>



						<div class="card-body">




							<div class="pr">
								<form name="searchForm" novalidate="novalidate" id="searchForm">
								
								<div class="form-group col-sm-3">
												<button type="submit" data-ng-click="exportAgencyWiseReportDataLatest('2');" 
												  class="btn  btn-success text-center" >Export Data </button>
												  
												  </div>
									
								</form>
							</div>


							<div class="table-responsive responsive-md">
								<table
													class="table table-striped table-bordered table-hover margin0 tbl-vm">
								

									
									<thead class="thead-default">
										<tr>
										
										   <th >S.No.</th>
                                           
											<th width="80%">Work Name</th>
											<th width="80%" >Sub Type of Work</th>
											
									        <th>AS Status</th>
											<th>Tender Status</th>
											
											
										</tr>
										
										
										
										
									</thead>
									
									<tbody>
									  
									  
									  <tr data-ng-repeat="item in items"
															>
															<td>{{$index+1}}</td>
															
															<td ><input style="width: 80%;" 
																type="text" disabled="disabled"
																data-ng-model="item.workName"  />
																</td>
																
																<td ><input style="width: 80%;" 
																type="text" disabled="disabled"
																data-ng-model="item.subTypeName" />
																</td>
																
																
																<td ><input
																type="text" disabled="disabled"
																data-ng-model="item.asStatus" />
																</td>
																
																
																<td ><input
																type="text" disabled="disabled"
																data-ng-model="item.tenderStatus" />
																</td>
																
																
															</tr>
									
									
									</tbody>
								</table>
							</div>


							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
