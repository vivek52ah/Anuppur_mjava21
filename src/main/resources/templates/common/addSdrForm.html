<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">
	//<![CDATA[
	//]]>
</script>
<style>
.label {
	color: white;
	padding: 8px;
}

.other {
	background-color: #e7e7e7;
	color: black;
}



.card {
    margin-bottom: 1.5rem;
    box-shadow: 0 0 7px rgb(0 0 0 / 70%);border-radius:7px
}


</style>
<div>
	<ol class="breadcrumb">

		<!-- 	<li  class="breadcrumb-item"><a href="#dashboard"><span
				th:text="${userName}"></span></a></li>  -->
		<li class="breadcrumb-item"><a href="#manageSdr"><span>Manage
			Reason of Dealay</span></a></li>

		<li class="breadcrumb-item active"><span>Add Reason of Dealay</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="" data-ng-click="doTheBack($event)"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span>Add Reason of Delay</span>
						</div>
						<form data-ng-submit="addSdr(sdrForm.$valid)"
							name="sdrForm" novalidate="novalidate"
							th:object="${addSdrForm}">
							<div class="card-body">
								<div class="row">
									<div class="col-md-12">
										<div data-ng-if="responseObject.errorMessage != null"
											class="text-danger">
											<strong>Error!</strong>
											<p>{{responseObject.errorMessage}}</p>
										</div>
									</div>
								</div>

								<div class="row">

									<div class="form-group col-sm-4">
										<label><span>Reason
											of Delay</span> <span class="aestrick">&#42;</span></label> <select
										class="form-control" id="workSubStatus" required="required"
										data-ng-model="sdrData.workSubStatusId"
										data-ng-init="loadWorkSubStatusByWorkStatus('9');"
										name="workSubStatus">
										<option value="" disabled="disabled">--Select--</option>
										<option data-ng-repeat="workSubStatus in worksSubStatus | filter:{workSubStatusId:'!4' | orderBy : 'workSubStatusNameE'}  "
										
											value="{{workSubStatus.workSubStatusId}}">{{workSubStatus.workSubStatusNameE}}</option>
										</select>
										<div data-ng-show="sdrForm.$submitted">
										<p class="help-block" style="color: red;"
											data-ng-show="sdrForm.workSubStatus.$error.required">
											<span th:text="#{pleaseSelect}">Please select</span> <span>Reason
												of Delay</span>
										</p>
										</div>
									</div>
			

									
									<div class="form-group col-sm-4">
										<label><span>Sub Reason of the Delay</span><span
											class="aestrick">&#42;</span></label> <input type="text"
											class="form-control" name="subDelayReason"
											maxlength="200" required="required"
											data-ng-model="sdrData.subDelayReason"
											id="sdrName" autofocus="autofocus" />
										<div data-ng-show="sdrForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sdrForm.subDelayReason.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span>Sub Reason of Delay</span>
											</p>
										</div>
									</div>
									
									<div class="form-group col-sm-4">
										<label><span>Created By</span><span class="aestrick">&#42;</span></label>
										
										<span class="form-control" name="createdBy"
											data-ng-model="sdrData.createdBy" id="createdBy"
											th:text="${userName}"></span>
									
										<div data-ng-show="sdrForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sdrForm.createdBy.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span>Created
													By</span>
											</p>
										</div>
									</div>
									
								</div>

								<div class="row">
									

									<div class="form-group col-sm-4">
										<label><span>Created Date</span><span class="aestrick">&#42;</span></label>
									
										<span class="form-control" name="createdDate"
											data-ng-model="sdrData.createdDate" id="createdDate"
											th:text="${myDate}"></span>
										
										<div data-ng-show="sdrForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="sdrForm.createdDate.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span>Created
													Date</span>
											</p>
										</div>
									</div>




								

								</div>

							</div>
							<div class="card-footer text-right">
								<button type="submit" class="btn btn-sm btn-primary" id="submit">
									<span th:text="#{save}">Save</span>
								</button>
								
							</div>
						</form>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>
	</div>
	<!-- /.container-fluid -->
</div>
</html>
