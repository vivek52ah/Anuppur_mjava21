.column-toggle-container {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	margin-bottom: 15px;
	padding: 10px;
	background-color: #f8f9fa;
	border-radius: 8px;
	border: 1px solid #dee2e6;

	overflow-y: auto;
}

.column-toggle-container label {
	background: #ffffff;
	border: 1px solid #ced4da;
	border-radius: 5px;
	padding: 5px 10px;
	font-size: 14px;
	cursor: pointer;
	display: flex;
	align-items: center;
	gap: 6px;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.column-toggle-container input[type="checkbox"] {
	cursor: pointer;
}

#toggleAllColumns {
	padding: 8px 16px;
	font-size: 14px;
	background-color: #007bff; /* Bootstrap blue */
	color: white;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
	transition: background-color 0.3s ease, transform 0.2s ease;
}

#toggleAllColumns:hover {
	background-color: #0056b3;
	transform: translateY(-1px);
}

#toggleAllColumns:active {
	transform: scale(0.98);
}

							<script>
   /*<![CDATA[*/
	   
	  function getBaseUrl() {
    var path = window.location.pathname;
    var firstPart = path.split('/')[1];

    // If context path is 'anuppur', return it with slash
    if (firstPart === 'anuppur') {
        return '/' + firstPart;
    }

    // Else no context path (like in LIVE), return empty
    return '';
} 
	   
    var table;

    $(document).ready(function () {
        table = $('#dynamic-w-table').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
            	url: getBaseUrl() + '/systemAdmin/fetchWorkWithLatestExpenses',
                type: 'GET',
                data: function (d) {
                	
                	
                	d.searchBoxVal = $('#searchBoxVal').val().trim();
                	d.implementationAgency = $('#implementationAgency').val();
                	d.workStatusId = $('#workStatusId').val();
                  d.userId = $('#userId').val();
                    
                  
                    
                	    
                	    
                	    
                	    console.log("Sending filters to backend: ", {
                	        searchBoxVal: d.searchBoxVal,
                	         implementationAgency: d.implementationAgency,
                	        workStatusId: d.workStatusId,
                	        userId: d.userId,
                	    
                	    });
                	    
                    d.iDisplayLength = d.length; // ✅ Already sent by DataTables
                    d.iDisplayStart = d.start;   // ✅ Already sent
                    d.sort = 'id';         // ✅ Your custom key if needed
                }

            },
            
            
            
            success: function(response) {
            console.log("Data from backend:", response);
            // यहाँ response को दिखा या table में bind कर
            $("#result").text(JSON.stringify(response));
        },
            
            
            scrollX: true,
            autoWidth: false,
            destroy: true,
            fixedHeader: true,
            responsive: true,
            dom: 'Blfrtip',
            pagingType: 'full_numbers',
            bStateSave: false,
            iDisplayLength: 10,
            iDisplayStart: 0,
            paging: true,
            aaSorting: [],
            
            lengthMenu: [[10, 25, 50, 100000], [10, 25, 50, "All"]],
            

            columns: [ 
                {
                    data: null,
                    title: "S.No.",
                    orderable: false,
                    render: function (data, type, row, meta) {
                        return meta.row + meta.settings._iDisplayStart + 1;
                    }
                },
                { data: "workNo", title: "Work No", defaultContent: "-" },
                { data: "workName", title: "Work Name", defaultContent: "-" },
                { data: "implementationAgencyName", title: "Construction Agency", defaultContent: "-" },
                { data: "userAssigneeName", title: "Area Officer", defaultContent: "-" },
                { data: "pac", title: "PAC (in Lac)", defaultContent: "-" },
                { data: "totalExpensess", title: "Total Expenditure(in Lac)", defaultContent: "-" },
                { data: "lastExpenditure", title: "Last Expenditure(in Lac)", defaultContent: "-" },
                { data: "workStatusName", title: "Current Physical Status", defaultContent: "-" },
          		{ data: "modifiedDate", title: "Last Inspection Date ", defaultContent: "-" },
			
               
               
            ],
            
           


            
            buttons: [
				{
                    extend: 'excelHtml5',
                    text: 'Export to Excel',
                    filename: 'Work Expenditure Report',
                    title: 'Work Expenditure Report', // ❌ PDF ke andar title nahi dikhega
                    exportOptions: {
                        columns: function (idx) {
                            return $('.col-toggle[data-column="' + idx + '"]').is(':checked');
                        }
                    }
                }, 
                {
				    extend: 'pdfHtml5',
				    text: 'Export to PDF',
				    title: '', // ❌ PDF ke andar title nahi dikhega
				    orientation: 'landscape',    // Aadha page ghooma ke wide banaya
				    pageSize: 'A3',              // A3 size for wide data
				    filename: 'Work Expenditure Report',                    // Remove default title
				    customize: function (doc) {
				    	

				        // 👉 HEADER
				        doc.content.splice(0, 0, {
				            text: [
				                { text: 'Collectorate Office, District Anuppur\n', fontSize: 14, bold: true, alignment: 'center' },
				                { text: 'Works Status Report\n\n', fontSize: 11, alignment: 'center' }
				            ]
				        });

				        // 👉 FOOTER
				        var now = new Date();
				        var dateStr = now.toLocaleDateString('en-IN');

				        doc.footer = function (currentPage, pageCount) {
				            return {
				            	columns: [
				            	    { text: 'Date: ' + dateStr, alignment: 'left', margin: [20, 0, 0, 0] },
				            	    { text: 'Disclaimer: Generated by Works Management System - District Anuppur', alignment: 'center' },
				            	    { text: 'Page ' + currentPage + ' of ' + pageCount, alignment: 'right', margin: [0, 0, 20, 0] }
				            	],

				                fontSize: 7,
				               
				            };
				        };

				        // 👉 Font & table adjustment
				        doc.defaultStyle.fontSize = 6;
				        doc.styles.tableHeader.fontSize = 7;

				        // 👉 Optional table line style
				        var objLayout = {};
				        objLayout['hLineWidth'] = function () { return 0.5; };
				        objLayout['vLineWidth'] = function () { return 0.5; };
				        objLayout['hLineColor'] = function () { return '#aaa'; };
				        objLayout['vLineColor'] = function () { return '#aaa'; };
				        objLayout['paddingLeft'] = function () { return 4; };
				        objLayout['paddingRight'] = function () { return 4; };
				        doc.content[1].layout = objLayout;

	<script>
/*<![CDATA[*/

window.currentImageIndex = 0;
window.currentImageList = [];

window.openProgressImages = function (rowIndex) {
    const data = window.progressDocsStore[rowIndex]; // <-- Yeh line important hai

    if (!data || !data.docs) {
        alert("No document data found.");
        return;
    }

    window.currentImageList = data.docs.filter(doc => doc.workStatusId === 10);
    window.currentImageIndex = 0;

    // AngularJS scope update
    const scope = angular.element(document.getElementById('imageModal')).scope();
    scope.$apply(function () {
        scope.workNo = data.workNo;
        scope.workSubTypeName = data.workSubTypeName;
        
	    if (data && data.docs) {
	        angular.forEach(data.docs, function(doc, idx) {
	            scope.date = doc.createdDate; // agar createdDate hai
	        });
	    }
    });

    if (window.currentImageList.length > 0) {
        window.currentImageIndex = 0;
        window.showImageAt(window.currentImageIndex);
        $('#imageModal').modal('show');
    } else {
        alert("No image found.");
    }
};


window.showImageAt = function (index) {
    if (index >= 0 && index < window.currentImageList.length) {
        const doc = window.currentImageList[index];
        const url = getBaseUrl() + '/downloadDocumentWSPro/' + doc.documentId;
        document.getElementById('modalImage').src = url;
        
        
        // AngularJS scope update for createdDate
        const scope = angular.element(document.getElementById('imageModal')).scope();
        scope.$apply(function () {
            scope.date = doc.createdDate; // yaha set hoga har image ke hisab se
        });

        // Optional: show counter (like 2/10)
	       document.getElementById('imageCounter').innerText =
     	       (index + 1) + '/' + window.currentImageList.length;
        
        
    }
};

window.showNextImage = function () {
    if (window.currentImageIndex < window.currentImageList.length - 1) {
        window.currentImageIndex++;
        window.showImageAt(window.currentImageIndex);
    }
};

window.showPrevImage = function () {
    if (window.currentImageIndex > 0) {
        window.currentImageIndex--;
        window.showImageAt(window.currentImageIndex);
    }
};
    /*]]>*/
</script>
