<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript" th:inline="none">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;

	function getApiBase() {
		var path = window.location.pathname;
		var parts = path.split('/').filter(Boolean);
		if (parts[0] === 'anuppur' && parts.length >= 2) {
			return '/' + parts[0] + '/' + parts[1] + '/';
		}
		return path.substring(0, path.lastIndexOf('/') + 1);
	}

	function stopPageLoading() {
		try {
			var inj = angular.element(document.querySelector('[data-ng-app]')).injector();
			if (inj) {
				inj.invoke(['$loading', function($loading) {
					$loading.finish('sample-1');
				}]);
			}
		} catch (e) {
			console.error('stopPageLoading:', e);
		}
	}

	function fetchUserList() {
		try {
			if ($.fn.DataTable.isDataTable('#dynamic-table')) {
				$('#dynamic-table').DataTable().destroy();
				$('#dynamic-table tbody').remove();
			}
			if ($('#dynamic-table tbody').length === 0) {
				$('#dynamic-table').append('<tbody></tbody>');
			}
			t = $('#dynamic-table').DataTable({
				processing: true,
				serverSide: true,
				pagingType: 'full_numbers',
				pageLength: 10,
				lengthMenu: [ [10, 25, 50, 100000], [10, 25, 50, 'All'] ],
				dom: "<'row'<'col-12 datatbl-top'l>>" +
					"<'row'<'col-md-6'r><'col-md-6'>>" +
					"<'row'<'col-md-12't>>" +
					"<'row'<'col-md-6'i><'col-md-6'p>>",
				order: [[0, 'asc']],
				language: { searchPlaceholder: 'firstName' },
				ajax: function(data, callback) {
					var params = {
						iDisplayStart: data.start,
						iDisplayLength: data.length,
						sEcho: data.draw,
						searchBoxVal: $('#searchBox').val().trim(),
						status: $('#status').val(),
						emailId: $('#emailId').val().trim()
					};
					if (data.order && data.order.length) {
						params.iSortCol_0 = data.order[0].column;
						params.sSortDir_0 = data.order[0].dir;
					}
					$.ajax({
						url: getApiBase() + 'fetchUserListForApproval',
						type: 'GET',
						data: params,
						dataType: 'json',
						success: function(json) {
							callback({
								draw: data.draw,
								recordsTotal: json.iTotalRecords || 0,
								recordsFiltered: json.iTotalDisplayRecords || 0,
								data: json.aaData || []
							});
							stopPageLoading();
						},
						error: function(xhr) {
							console.error('fetchUserListForApproval failed:', xhr);
							callback({ draw: data.draw, recordsTotal: 0, recordsFiltered: 0, data: [] });
							stopPageLoading();
						}
					});
				},
				columns: [
					{ data: 'index', orderable: false },
					{ data: 'firstName', defaultContent: '-' },
					{ data: 'lastName', defaultContent: '-' },
					{ data: 'mobileNo', defaultContent: '-' },
					{ data: 'emailId', defaultContent: '-' },
					{ data: 'divisionName', defaultContent: '-' },
					{ data: 'role.roleName', defaultContent: '-', render: function(d, type, row) {
						return (row.role && row.role.roleName) ? row.role.roleName : (row.roleName || '-');
					}},
					{ data: 'districtName', defaultContent: '-' },
					{ data: 'status', defaultContent: '-' },
					{ data: 'departmentName', defaultContent: '-', render: function(d, type, row) {
						return row.departmentName == null ? '-' : row.departmentName;
					}},
					{ data: null, orderable: false, defaultContent: '' }
				],
				createdRow: function(nRow, aData) {
					var $action = $('td:eq(10)', nRow).html('');
					if (aData.status === 'Pending') {
						$action.append(
							'<a class="btn btn-xs btn-primary" title="View/Edit" href="#ApproveUser/' +
							encryptFunc(aData.id) + '"><i class="fa fa-pencil"></i></a>'
						);
					}
				}
			});
		} catch (e) {
			console.error('fetchUserList failed:', e);
			stopPageLoading();
		}
	}
// 	$(function() {
// 		$('.datatbl-top')
// 				.append(
// 						'<div class="dt-buttons btn-group ml-1"><a class="btn btn-secondary" href="#addUserForm"> <span th:text="#{addUser}">Add User</span></a></div>')
// 	});
	function deleteUser(id) {

		/* return angular.element(document.getElementById('CommonController')) */
		return $('#page-div').scope().deleteUser(id);
	}
	function reDraw() {
		t.draw();
	}
	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	$('#applyFilters').click(function(e) {
		//e.preventDefault();
		$('#filters').fadeOut(300);
		//$('#searchForm').submit();
	});
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});
	/*]]>*/
</script>
