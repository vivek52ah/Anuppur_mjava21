<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">

	//<![CDATA[
	//]]>
</script>
<div>
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				>Home</span></a></li>
		<li class="breadcrumb-item active"><span>Financial Year</span></li>
		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="#" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span >Back</span></a>
			</div>
		</li>
	</ol>
<div class="container-fluid"  >
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span>Add  Financial Year</span>
						</div>
						<form data-ng-submit="addFinancialForm(finanicalForm.$valid)" name="finanicalForm" novalidate="novalidate" >
							<div class="card-body">
							   <div class="row">
									<div class="col-md-12">
										<div data-ng-if="responseObject.errorMessage != null"
											class="text-danger">
											<strong>Error!</strong>
											<p>{{responseObject.errorMessage}}</p>
										</div>
									</div>
									<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
								</div>
								<div class="row">
								
								  
	                                 <div class="form-group col-sm-3">
	                                  	  <label><span> Add Financial Year</span><span
											class="aestrick">&#42;</span></label> 
	                                  	  <select class="form-control" id="financialYear"
							 
							                name="financialYear"  data-ng-model="financialYear.financialYearName" data-ng-change="">
							                <option value="" disabled="disabled">--Select--</option>
							                <option 
							             	value="{{financialYearjson.financialYearName}}">{{financialYearjson.financialYearName}}</option>
						                    </select>
	                                  	  
	                                  	  
	                                  	  
	                                 </div>
	                            
								<div class="form-group col-sm-4"
						data-ng-init="loadFinancialYears()">
						<label><span> Available Financial Years</span></label>
						<select class="form-control" id="financialYear"
							 
							name="financialYear"  data-ng-model="fd" data-ng-change="">
							<option value="" disabled="disabled">--Select--</option>
							<option data-ng-repeat="fy in financialYears "
								value="{{fy.financialYearId}}">{{fy.financialYearName}}</option>
						</select>
						
					</div>
					
					
								
								
									
								
								</div>	
							<div class="card-footer text-right">
			                 	<button type="submit" class="btn btn-sm btn-primary" id="submit">
			                	<span >submit</span>
			              		</button>
								
					       </div>
					  	</div>
				    </form>
				    </div>
				</div>
			</div>
		</div>
	</div>
</div>
</html>
