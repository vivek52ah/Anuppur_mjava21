<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">
	//<![CDATA[
	function check_pass() {
		if (document.getElementById('password').value
				&& document.getElementById('confirmPassword').value) {
			if (document.getElementById('password').value == document
					.getElementById('confirmPassword').value) {
				document.getElementById('submit').disabled = false;
				document.getElementById('passwordError').style.display = 'none';
			} else {
				document.getElementById('submit').disabled = true;
				document.getElementById('passwordError').style.display = 'block';
			}
		}
	}
	//]]>
</script>

<style>


.card {
    margin-bottom: 1.5rem;
    box-shadow: 0 0 7px rgb(0 0 0 / 70%);border-radius:7px
}



</style>
<div>
	<ol class="breadcrumb">

		<li class="breadcrumb-item"><a href="#manageDistricts"><span
				>Manage Districts</span></a></li>

		<li class="breadcrumb-item active"><span  data-ng-hide=" districtData.districtId != null">Add
				District</span><span  data-ng-hide="districtData.districtId == null" data-ng-init="loadDistrictDetails()">Edit
				District</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="#" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span>Back</span></a>
			</div>
		</li>
	</ol>

	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span  data-ng-show=" districtData.districtId == null">Add
								District</span><span  data-ng-show=" districtData.districtId != null">Edit 
								District</span>
						</div>
						<form data-ng-submit="addDistrict(districtForm.$valid)" name="districtForm"
							novalidate="novalidate" data-ng-init="">
							<div class="card-body">
								<div class="row">
									<div class="col-md-12">
										<div data-ng-if="responseObject.errorMessage != null"
											class="text-danger">
											<strong>Error!</strong>
											<p>{{responseObject.errorMessage}}</p>
										</div>
									</div>
								</div>
								<div class="row">
								<div class="form-group col-sm-4">
										<label><span>District Name</span><span class="aestrick">&#42;</span></label>
										<input type="text" class="form-control" name="districtName" required="required"
											maxlength="100"  data-ng-model="districtData.districtName"
											 id="districtName"
											autofocus="autofocus" />
										<div data-ng-show="districtForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="districtForm.districtName.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													>District  Name</span>
										
											</p>
										</div>
								</div> 
								
								 
								<div class="form-group col-sm-4">
										<label><span>District Code</span><span class="aestrick">&#42;</span></label>
										<input type="text" class="form-control" name="districtCode"
											maxlength="100"  data-ng-model="districtData.districtCode" required="required"
											 id="districtCode"  max="3"
											autofocus="autofocus" />
										<div data-ng-show="districtForm.$submitted">
										 <div ng-show="myForm.numberInput.$error.max">
      The maximum allowed value is 3.
    </div>
											<p class="help-block" style="color: red;"
												data-ng-show="districtForm.districtCode.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													>District  Code</span>
												
											</p>
										</div>
								</div>
								<div class="form-group col-sm-4">
										<label><span>District Name Hindi</span><span class="aestrick">&#42;</span></label>
										<input type="text" class="form-control" name="districtHindi" 
											maxlength="100"  data-ng-model="districtData.districtNameH"
											 id="districtHindi"
											autofocus="autofocus" />
										<div data-ng-show="districtForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="districtForm.districtHindi.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span
													>District Hindi name</span>
												
											</p>
										</div>
								</div>  
								<div class="form-group col-sm-4">
										<label><span>Division</span><span class="aestrick">&#42;</span></label>
										<select class="form-control" id="divisionId" required="required"
													data-ng-model="districtData.divisionId"
													data-ng-init="loadDivisions();"
													data-ng-change=" " name="divisionId">
													<option value="" disabled="disabled">--Select
														Division--</option>
													<option data-ng-repeat="divisionName in divisions | orderBy : 'divisionName'"
														value="{{divisionName.divisionId}}">{{divisionName.divisionName}}</option>
												</select>
										<div data-ng-show="districtForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="districtForm.districtHindi.$error.required">
												<span >Please Select</span> <span
													>Division</span>
												
											</p>
										</div>
									</div>
								
								
								</div>
								


								</div>
								<div class="card-footer text-right" data-ng-hide ="districtData.id != null"> 
								<button type="submit" class="btn btn-sm btn-primary" id="submit" >
									<span >Submit</span>
								</button></div>
								<div data-ng-hide="districtData.id == null" class="card-footer text-right">
								<button type="submit" class="btn btn-sm btn-primary"    id="submit2">
									<span >Submit</span>
								</button>
								<!-- <button type="reset" class="btn btn-sm btn-danger">Reset</button> -->
							</div>
						</form>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>
	</div>
	<!-- /.container-fluid -->
</div>
</html>
