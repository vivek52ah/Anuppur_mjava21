<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Verify password reset OTP</title>
    <link rel="stylesheet" th:href="@{/new-assets/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Verify OTP</h1>
                    <div class="alert alert-info" th:if="${message != null}" th:text="${message}"></div>
                    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                    <form method="post" th:action="@{/verify-reset-otp}">
                        <label for="otp" class="form-label">Six-digit OTP</label>
                        <input id="otp" name="otp" class="form-control" type="text" inputmode="numeric"
                               pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required />
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-primary w-100 mt-3" type="submit">Verify OTP</button>
                    </form>
                    <a class="btn btn-link px-0 mt-2" th:href="@{/forgotpassword}">Start again</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
