<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
</head>
<script type="text/javascript">
	//<![CDATA[
	//]]>
</script>
<div>
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li>
		<li class="breadcrumb-item"><a href="#manageSubEngg"><span>Manage
					Sub Engineer</span></a></li>
		<li class="breadcrumb-item active"><span>Edit Sub Engineer</span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" href="#" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>

	<div class="container-fluid" data-ng-init="loadSubEnggDetails();">
		<div class="animated fadeIn">
			<div class="row">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-wpforms"></i> <span>Edit Sub Engineer</span>
						</div>
						<form data-ng-submit="editSubEngg(subEnggForm.$valid)"
							name="subEnggForm" novalidate="novalidate">
							<div class="card-body">
								<div class="row">
									<div class="col-md-12">
										<div data-ng-if="responseObject.errorMessage != null"
											class="text-danger">
											<strong>Error!</strong>
											<p>{{responseObject.errorMessage}}</p>
										</div>
									</div>
								</div>

								<div class="row">
									<div class="form-group col-sm-4">
										<label><span>Sub Engineer Name</span><span
											class="aestrick">&#42;</span></label> <input type="text"
											class="form-control" name="subEnggName" maxlength="100"
											required="required" data-ng-model="subEnggData.subEnggName"
											id="subEnggName" autofocus="autofocus" />
										<div data-ng-show="subEnggForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="subEnggForm.subEnggName.$error.required">
												<span th:text="#{pleaseEnter}">Please enter</span> <span>Implementation
													Agency Name</span>
											</p>
										</div>
									</div>
									<div class="form-group col-sm-4"
										data-ng-init="loadImplementationAgencies()">
										<label><span>Implementation Agency</span><span
											class="aestrick">&#42;</span></label> <select class="form-control"
											id="implementationAgency" required="required"
											data-ng-model="subEnggData.implAgencyId"
											name="implementationAgency">
											<option value="" disabled="disabled">--Select--</option>
											<option
												data-ng-repeat="ia in implementationAgencies | orderBy : 'implementationAgencyNameE'"
												value="{{ia.implementationAgencyId}}">{{ia.implementationAgencyNameE}}</option>
										</select>
										<div data-ng-show="subEnggForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="subEnggForm.implementationAgency.$error.required">
												<span th:text="#{pleaseSelect}">Please select</span> <span>Implementation
													Agency</span>
											</p>
										</div>
									</div>

									<div class="form-group col-sm-4"
										data-ng-init="loadDistricts();">
										<label><span>District</span><span class="aestrick">&#42;</span></label>
										<select class="form-control"
											data-ng-model="subEnggData.districtId" name="district"
											id="district" required="required" disabled="disabled">
											<option value="" disabled="disabled">--Select--</option>
											<option
												data-ng-repeat="district in districts | orderBy : 'districtName'"
												value="{{district.districtId}}">{{district.districtName}}</option>
										</select>
										<div data-ng-show="subEnggForm.$submitted">
											<p class="help-block" style="color: red;"
												data-ng-show="subEnggForm.district.$error.required">
												<span th:text="#{pleaseSelect}">Please select</span> <span
													th:text="#{district}">District</span>
											</p>
										</div>
									</div>
								</div>

							</div>
							<div class="card-footer text-right">
								<button type="submit" class="btn btn-sm btn-primary" id="submit">
									<span th:text="#{submit}">Submit</span>
								</button>
								<!-- <button type="reset" class="btn btn-sm btn-danger">Reset</button> -->
							</div>
						</form>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>
	</div>
	<!-- /.container-fluid -->
</div>
</html>
