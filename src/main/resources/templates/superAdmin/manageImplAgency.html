<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<script th:src="@{/js/language.js}"></script>
<style>
table tr td:last-child,table tr th:last-child {
	text-align:center;
}
</style>
</head>
<script type="text/javascript">
	/*<![CDATA[*/
	//Plug-in to fetch page data 
	jQuery.fn.dataTableExt.oApi.fnPagingInfo = function(oSettings) {
		return {
			"iStart" : oSettings._iDisplayStart,
			"iEnd" : oSettings.fnDisplayEnd(),
			"iLength" : oSettings._iDisplayLength,
			"iTotal" : oSettings.fnRecordsTotal(),
			"iFilteredTotal" : oSettings.fnRecordsDisplay(),
			"iPage" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings._iDisplayStart / oSettings._iDisplayLength),
			"iTotalPages" : oSettings._iDisplayLength === -1 ? 0 : Math
					.ceil(oSettings.fnRecordsDisplay()
							/ oSettings._iDisplayLength)
		};
	};
	var t = null;
	function fetchImplAgencyList() {

		t = $("#dynamic-table")
				.DataTable(
						{
							"processing" : true,
							"serverSide" : true,
							"sort" : "position",
							//bStateSave variable you can use to save state on client cookies: set value "true" 
							"bStateSave" : false,
							//Default: Page display length
							"iDisplayLength" : 10,
							//We will use below variable to track page number on server side(For more information visit: http://legacy.datatables.net/usage/options#iDisplayStart)
							"iDisplayStart" : 0,
							"pagingType" : "full_numbers",
							"aaSorting" : [],
							/* "dom" : 'Blrtip', */
							"dom" : "<'row'<'col-12 datatbl-top'lB>>"
									+ "<'row'<'col-md-6'r><'col-md-6'>>"
									+ "<'row'<'col-md-12't>><'row'<'col-md-6'i><'col-md-6'p>>",
							"buttons" : [
									{
										extend : 'excelHtml5',
										title : 'Construction Agency Data',
										text : '<span class="fa fa-file-excel-o"></span> Excel Export',
										exportOptions : {
											columns : [ 0, 1, 2, 3, 4 ]
										}
									}, ],
							"lengthMenu" : [ [ 10, 25, 50, 100000 ],
									[ 10, 25, 50, "All" ] ],

							"fnDrawCallback" : function() {

								angular.element('#StartOrFinishSpinnerId')
										.scope().startOrStopSpinner(false);

								//Get page numer on client. Please note: number start from 0 So
								//for the first page you will see 0 second page 1 third page 2...
								//Un-comment below alert to see page number
								//alert("Current page number: "+this.fnPagingInfo().iPage);    
							},
							"fnServerParams" : function(aoData) {
								aoData.push({
									"name" : "searchBoxVal",
									"value" : $('#searchBox').val().trim()
								});
							},
							"fnCreatedRow" : function(nRow, aData, iDataIndex) {
								$('td:eq(5)', nRow)
										.html(
												'<a class="btn btn-xs btn-primary" data-toggle="tooltip" data-placement="top" title="View/Edit" href="#editImplAgencyForm/'
														+ encryptFunc(aData.implementationAgencyId)
														+ '"><i class="fa fa-pencil"></i></a>');
								$('td:eq(5)', nRow)
										.append(
												'<a onclick="return deleteImplAgency('
														+ aData.implementationAgencyId
														+ ');" href="" class="btn btn-xs btn-danger" data-toggle="tooltip" data-placement="top" title="Delete"><i class="fa fa-trash-o"></i></a> ');
							},
							"fnRowCallback" : function(nRow, aData,
									iDisplayIndex, iDisplayIndexFull) {
								/* $('td:eq(0)', nRow)
										.html(
												(this.fnPagingInfo().iPage
								 * this.fnPagingInfo().iLength + (iDisplayIndex + 1))); */
							},

							"language" : {
								searchPlaceholder : "Name"
							},
							"sAjaxSource" : "fetchImplAgencyList",

							"columns" : [ {
								"data" : "index",
								"bSortable" : false
							}, {
								"mData" : "implementationAgencyNameE",
								"bSortable" : false
							}, {
								"mData" : "implAgencyType",
								"bSortable" : false
							},

							{
								"mData" : "createdBy",
								"bSortable" : false
							},

							{
								"mData" : "createdDate",
								"bSortable" : false
							},

							{
								"mData" : null,
								"bSortable" : false
							} ],

						});
	}
// 	$(function() {
// 		$('.datatbl-top')
// 				.append(
// 						'<div class="dt-buttons btn-group ml-1"><a class="btn btn-secondary" href="#addImplAgencyForm"> <span th:text="#{addImplAgency}">Add Construction Agency</span></a></div>')
// 	});
	function deleteImplAgency(id) {

		/* return angular.element(document.getElementById('CommonController')) */
		return $('#page-div').scope().deleteImplAgency(id);
	}
	function reDraw() {
		t.draw();
	}
	$('#filter-btn').click(function() {
		$('#filters').fadeToggle(300);
	});
	$('.filter-close').click(function(e) {
		e.preventDefault();
		$(this).parent('#filters').fadeOut(300);
	});
	$('#applyFilters').click(function(e) {
		//e.preventDefault();
		$('#filters').fadeOut(300);
		//$('#searchForm').submit();
	});
	var filter_box = $('#filters');
	$(document).mouseup(function(e) {
		if (!filter_box.is(e.target) && filter_box.has(e.target).length === 0) {
			$('#filters:visible').fadeOut('300');
		}
	});
	/*]]>*/
</script>

<style>

.card {
    margin-bottom: 1.5rem;
    box-shadow: 0 0 7px rgb(0 0 0 / 70%);border-radius:7px
}

.btn.btn-secondary {
    box-shadow: 0px 0px 7px rgb(0 0 0 / 10%);
}

btn-xs.btn-primary {
    box-shadow: 0px 0px 20px rgb(0 0 0 / 30%);
}

input#searchBox {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
li#dynamic-table_first {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
li#dynamic-table_previous {
    box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}
a.page-link {
 box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}

select.form-control.form-control-sm {
 box-shadow: 0px 0px 12px rgb(0 0 0 / 8%);
}

</style>

<div id="StartOrFinishSpinnerId"></div>

<div id="page-div">
	<!-- Breadcrumb -->
	<ol class="breadcrumb">
		<!-- <li class="breadcrumb-item"><a href="#dashboard"><span
				th:text="#{home}">Home</span></a></li> -->
				
				 
 <li class="breadcrumb-item"><a ><span
				th:text="#{home}">Home</span></a></li>

		<!-- <li  class="breadcrumb-item"><a href="#dashboard"><span
				th:text="${roleName}"></span></a></li>  -->

		<li class="breadcrumb-item active"><span>Agency Master </span></li>

		<!-- Breadcrumb Menu-->
		<li class="breadcrumb-menu d-md-down-none">
			<div class="btn-group" role="group" aria-label="Button group">
				<a class="btn" data-ng-click="doTheBack()"><i
					class="icon-arrow-left-circle"></i> &nbsp;<span th:text="#{back}">Back</span></a>
			</div>
		</li>
	</ol>
	<div class="container-fluid">
		<div class="animated fadeIn">
			<div class="row" data-ng-init="loadImplAgencyList()">
				<div class="col-md-12">
					<div class="card">
						<div class="card-header">
							<i class="fa fa-folder-open-o"></i> <span>Construction
								Agency List</span>
						</div>
						<div class="card-body">
						<div class="form-group text-right"><a class="btn btn-secondary" href="#addImplAgencyForm"> <span th:text="#{addImplAgency}">Add Construction Agency</span></a></div>
							<div class="pr">
								<form name="searchForm" novalidate="novalidate" id="searchForm"
									data-ng-submit="searchBySearchBox()">
									<div class="row ">
										<div class="input-group mb-3 mr-6  col-md-6 filter-box">
											<input type="text" class="form-control" id="searchBox"
												placeholder="Search by Agency Name [Please enter atleast two characters]"
												data-ng-model="searchBox" />
											
											<div class="btn-group pr">
												<button class="btn btn-secondary" type="submit"
													title="Search">
													<i class="fa fa-search"></i>
												</button>
												<button class="btn btn-secondary" type="reset"
													data-ng-click="resetFunction()" title="Reset">
													<i class="fa fa-refresh"></i>
												</button>
													
												<!-- <button class="btn btn-secondary" id="filter-btn"
													title="Filter" type="button">
													<i class="fa fa-filter"></i>
												</button> -->
												<div id="filters">
													<a href="" class="filter-close"><i
														class="icon-close icons"></i></a>
												</div>
											</div>
											
											&nbsp;&nbsp;
											
										</div>
										
										
									
									
									
									</div>
								</form>
							</div>
							<div class="row">
								<div class="col-md-12">
									<div data-ng-if="responseObject.successMessage != null"
										class="text-success">
										<strong>Success!</strong>
										<p>{{responseObject.successMessage}}</p>
									</div>
								</div>
							</div>
							<div class="table-responsive responsive-md">
								<table id="dynamic-table"
									class="table table-striped table-bordered table-hover table-outline">
									<thead class="thead-default">
										<tr>
											<th class="text-center"><span>S.No.</span></th>
											<th><span>Construction Agency Name</span></th>
											<th><span>Type of Construction Agency</span></th>
											<th><span>Created By</span></th>
											<th><span>Created Date</span></th>
											<th nowrap="nowrap" class="text-center"><span th:text="#{action}">Action</span></th>
										</tr>
									</thead>
								</table>
							</div>
						</div>
					</div>
				</div>
				<!--/.col-->
			</div>
			<!--/.row-->
		</div>

	</div>
	<!-- /.container-fluid -->
</div>
</html>
