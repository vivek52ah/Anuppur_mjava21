<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Set new password</title>
    <link rel="stylesheet" th:href="@{/new-assets/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Set new password</h1>
                    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                    <form method="post" th:action="@{/complete-password-reset}">
                        <input type="hidden" name="resetToken" th:value="${resetToken}" />
                        <label for="newPassword" class="form-label">New password</label>
                        <input id="newPassword" name="password" class="form-control" type="password"
                               minlength="8" maxlength="64" autocomplete="new-password" required />
                        <div class="form-text">Use 8-64 characters with upper, lower, number and special character.</div>
                        <label for="confirmPassword" class="form-label mt-3">Confirm password</label>
                        <input id="confirmPassword" name="confirmPassword" class="form-control" type="password"
                               minlength="8" maxlength="64" autocomplete="new-password" required />
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-primary w-100 mt-3" type="submit">Set password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
