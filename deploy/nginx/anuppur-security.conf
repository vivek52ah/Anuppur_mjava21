# Security include for the Anuppur WMS TLS virtual host.
# Include these directives in the HTTPS `server` block and remove any duplicate
# add_header directives for headers already emitted by Spring Security.

server_tokens off;
absolute_redirect off;
port_in_redirect off;

# Canonicalize the context path with a relative redirect. This prevents scheme
# downgrade and untrusted Host reflection in Location.
location = /anuppur {
    return 308 /anuppur/;
}

location /anuppur/ {
    proxy_pass http://127.0.0.1:8080/anuppur/;
    proxy_http_version 1.1;

    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_redirect off;
    proxy_intercept_errors off;
}

# Do not configure a global Content-Disposition header at this layer. Download
# endpoints set an attachment filename themselves; error responses must not get
# a synthetic filename such as f.txt.
